<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%%post.title%% :: 시누의 블로그</title>
    <link rel="stylesheet" type="text/css" href="../../assets/sinublog.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=calendar_today,info,label,schedule,warning" />
</head>
<body>
    <div class="content">
        <div class="common-topbar">
            <a href="../../">
                <div class="topbar-left">
                    <img class="topbar-icon" src="../../assets/icon.png"><span class="topbar-text topbar-title">시누의 블로그</span>
                </div>
            </a>
            <a href="/">
                <div class="topbar-right">
                    <span class="topbar-subtext clickable">시누의 싸이버스페이스</span>
                </div>
            </a>
        </div>
        <div class="common-fseparator"></div>
        <div class="post-header">
            <div class="post-title">%%post.title%%</div>
            <div class="post-info-container">
                <div class="post-info" title="작성 일자"><span class="material-symbols-outlined icon-right-padding">calendar_today</span>%%post.created.date%%</div>
                <div class="post-info%%conditional???created_eq_modified??? post-info-hidden%%" title="마지막 수정 일자"><span class="material-symbols-outlined icon-right-padding">schedule</span>%%post.modified.date%%</div>
                <div class="post-info" title="카테고리"><span class="material-symbols-outlined icon-right-padding">label</span><a href="../../categories/%%post.category%%/">%%post.category%%</a></div>
            </div>
        </div>
        <div class="common-mseparator"></div>
        <div class="post-body">
            %%post.body%%
        </div>
        <div class="common-mseparator"></div>
        <div class="post-tail">
            <script src="https://giscus.app/client.js"
                data-repo="sinusinu/blog"
                data-repo-id="R_kgDOK6xloQ"
                data-category="Comments"
                data-category-id="DIC_kwDOK6xloc4Cb0BW"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="noborder_gray"
                data-lang="ko"
                data-loading="lazy"
                crossorigin="anonymous"
                async>
            </script>
        </div>
        <div class="common-fseparator"></div>
        <div class="common-footer">
            <div><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ko"><img src="../../assets/ccbyncsa.svg" width="120px" height="42px"></a></div>
            <div>© 2023–%%year%% sinu. 모든 권리 보유</div>
            <div><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ko">CC BY-NC-SA 4.0</a> 하에 배포됨</div>
        </div>
    </div>
    <script>
        // surely there's gotta be a better way to do this...
        function updateGiscusTheme() {
            function sendMessage(message) {
                const iframe = document.querySelector('iframe.giscus-frame');
                iframe?.contentWindow.postMessage({ giscus: message }, 'https://giscus.app');
            }

            sendMessage({ setConfig: { theme: getTargetTheme() } });
        }

        function checkGiscusLoaded() {
            const iframe = document.querySelector('iframe.giscus-frame');
            if (iframe?.classList.contains('giscus-frame--loading')) {
                setTimeout(checkGiscusLoaded, 500);
            } else {
                setTimeout(updateGiscusTheme(), 1000);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkGiscusLoaded();
        });

        window?.matchMedia?.('(prefers-color-scheme:dark)').addEventListener('change', updateGiscusTheme);

        function isDark() { return window?.matchMedia?.('(prefers-color-scheme:dark)')?.matches ?? false; }
        function getTargetTheme() { return isDark() ? 'noborder_gray' : 'light'; }
    </script>
</body>
</html>
